<section class="painel-aluno-shell">
  <header class="painel-header">
    <div class="brand-block">
      <div class="brand-icon">INAP</div>
      <div>
        <strong>Instituto Nacional</strong>
        <span>Controle de Certificados</span>
      </div>
    </div>

    <div class="user-block">
      <div>
        Olá, <strong>{{ nomeUsuario }}</strong>
      </div>
      <button class="btn-sair" (click)="logout()" type="button">Sair</button>
    </div>
  </header>

  <main class="form-container">
    <div class="form-card">
      <h1>Solicitar Certificado</h1>
      <p class="subtitle">Preencha os dados abaixo para enviar sua solicitação.</p>

      <form class="aluno-form" [formGroup]="solicitacoesForms" (ngSubmit)="onSubmit()">
        <label class="full-width">
          <span>Nome completo</span>
          <input
            type="text"
            placeholder="Ex: Lucas Pereira Santos"
            formControlName="nomeAluno"
          />
        </label>

        <label class="full-width campo-destaque">
          <span class="label-destaque">
            <i class="bi bi-mortarboard-fill"></i>
            Curso * (obrigatório)
          </span>
          <select
            formControlName="cursoId"
            class="form-select select-destaque"
            id="cursoSelect"
            name="cursoSelect">
            <option value="" disabled selected>⚠️ Selecione o curso antes de continuar...</option>

            @for (curso of cursos; track curso.id) {
              <option [value]="curso.id">
                {{ curso.nome }}
              </option>
            }
          </select>
          @if (solicitacoesForms.get('cursoId')?.invalid && solicitacoesForms.get('cursoId')?.touched) {
            <small class="erro-curso">⚠️ Por favor, selecione um curso</small>
          }
          @if (solicitacoesForms.get('cursoId')?.value === '' || solicitacoesForms.get('cursoId')?.value === null) {
            <small class="dica-curso">💡 Dica: Não esqueça de selecionar seu curso!</small>
          }
        </label>
        <!-- <label class="full-width">
          <span>Curso</span>
          <input
            type="text"
            placeholder="Ex: Administração, Informática..."
            formControlName="curso"
          />
        </label> -->

        <label>
          <span>Data de conclusão</span>
          <input type="date" formControlName="dataConclusao" />
        </label>

        <label>
          <span>Telefone</span>
          <input
            type="tel"
            placeholder="(11) 99999-9999"
            maxlength="15"
            formControlName="telefone"
            mask="(00) 00000-0000"
            [dropSpecialCharacters]="false"
          />
        </label>

        <label class="full-width">
          <span>CPF</span>
          <input
            type="text"
            placeholder="000.000.000-00"
            maxlength="14"
            formControlName="cpf"
            mask="000.000.000-00"
            [dropSpecialCharacters]="false"
          />
        </label>

        <div class="escolha-formato full-width">
          <span class="label-titulo">Formato do certificado</span>

          <div class="format-cards">
            <label class="format-card">
              <input type="radio" formControlName="tipoCertificado" value="IMPRESSO" checked />
              <div class="card-icon">🖨️</div>
              <div class="card-text">
                <span class="card-title">Impresso</span>
                <span class="card-desc">Entrega física</span>
              </div>
            </label>

            <label class="format-card">
              <input type="radio" formControlName="tipoCertificado" value="DIGITAL" />
              <div class="card-icon">💻</div>
              <div class="card-text">
                <span class="card-title">Digital</span>
                <span class="card-desc">Arquivo PDF</span>
              </div>
            </label>
          </div>
        </div>

        <div class="form-actions full-width">
          @if (isAdmin) {
            <button class="btn-voltar" type="button" (click)="voltarAdmin()" [disabled]="isSubmitting">Voltar</button>
          }
          <button class="btn-submit" type="submit" [disabled]="isSubmitting">
            @if (isSubmitting) {
              <span class="spinner"></span>
            }
            {{ isSubmitting ? 'Enviando...' : 'Enviar solicitação' }}
          </button>
        </div>
      </form>
    </div>
  </main>
</section>
